[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-assurance"
version = "0.1.1"
description = "Evidence-driven repository assurance orchestrator"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
repo-assurance = "repo_assurance.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
plugin = ["mcp>=2,<3"]
lock = ["pip-tools==7.6.1"]
release = ["build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_github: opt-in authenticated GitHub acceptance; skipped unless explicitly enabled",
]
