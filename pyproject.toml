[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-assurance"
version = "0.2.0"
description = "Evidence-driven repository assurance orchestrator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/oaslananka/repo-assurance"
Repository = "https://github.com/oaslananka/repo-assurance"
Issues = "https://github.com/oaslananka/repo-assurance/issues"

[project.scripts]
repo-assurance = "repo_assurance.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
plugin = ["mcp>=2,<3"]
lock = ["pip-tools==7.6.1"]
release = ["build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live_github: opt-in authenticated GitHub acceptance; skipped unless explicitly enabled",
]
