name: Release Validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Exact existing release tag to validate (for example v0.1.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Install locked CI and release dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Install repository package without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify CI lock is current
        run: |
          python scripts/update_ci_lock.py
          git diff --exit-code -- requirements/ci.lock

      - name: Run release validation suite
        run: |
          pytest -q
          python -m compileall -q src tests
          for catalog in controls/*.v1.json; do
            python -m repo_assurance validate control "$catalog"
          done

      - name: Build exact-commit release artifact set
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
        run: python scripts/build_release.py --expected-tag "$EXPECTED_TAG" --output dist/release

      - name: Verify release checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS

      - name: Upload validated release artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repo-assurance-release-${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
          path: dist/release
          if-no-files-found: error
          retention-days: 30
