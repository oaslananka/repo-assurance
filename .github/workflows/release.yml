name: Release Validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Exact existing release tag to validate (for example v0.2.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: validate-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Install locked CI and release dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements/ci.lock"

      - name: Install repository package without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify CI lock is current
        run: |
          python scripts/update_ci_lock.py
          git diff --exit-code -- requirements/ci.lock

      - name: Run release validation suite
        run: |
          pytest -q
          python -m compileall -q src tests
          for catalog in controls/*.v1.json; do
            python -m repo_assurance validate control "$catalog"
          done

      - name: Build exact-commit release artifact set
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
        run: python scripts/build_release.py --expected-tag "$EXPECTED_TAG" --output dist/release

      - name: Smoke-test installed wheel runtime
        env:
          EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
        run: |
          VERSION="${EXPECTED_TAG#v}"
          WHEEL="$(find dist/release -maxdepth 1 -type f -name 'repo_assurance-*.whl' -print -quit)"
          test -n "$WHEEL"
          SMOKE_VENV="$RUNNER_TEMP/repo-assurance-wheel-smoke"
          rm -rf "$SMOKE_VENV"
          python -m venv --system-site-packages "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install --disable-pip-version-check --no-deps "$WHEEL"
          VERSION="$VERSION" "$SMOKE_VENV/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import sys
          from pathlib import Path

          import repo_assurance
          from repo_assurance.cli import build_parser
          from repo_assurance.core.catalog import load_catalog
          from repo_assurance.core.schema import load_schema

          package_path = Path(repo_assurance.__file__).resolve()
          environment_root = Path(sys.prefix).resolve()
          if environment_root not in package_path.parents:
              raise SystemExit(
                  f"wheel was not imported from smoke venv: {package_path}"
              )

          expected = os.environ["VERSION"]
          actual = importlib.metadata.version("repo-assurance")
          if actual != expected:
              raise SystemExit(
                  f"installed version {actual!r} != expected {expected!r}"
              )

          controls = load_catalog()
          if not controls:
              raise SystemExit("installed control catalog is empty")

          schema = load_schema("control.v1")
          if schema.get("type") != "object":
              raise SystemExit("installed control schema is invalid")

          if build_parser().prog != "repo-assurance":
              raise SystemExit("installed CLI parser is invalid")
          PY

      - name: Verify release checksums
        working-directory: dist/release
        run: sha256sum --check SHA256SUMS

      - name: Upload validated release artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-assurance-release-${{ github.event_name == 'workflow_dispatch' && inputs.expected_tag || github.ref_name }}
          path: dist/release
          if-no-files-found: error
          retention-days: 30
