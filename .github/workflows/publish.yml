name: Publish Validated Release

on:
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Exact existing release tag to publish (for example v0.2.0)
        required: true
        type: string
      validation_run_id:
        description: Successful Release Validation workflow run ID for this exact tag
        required: true
        type: string
      target:
        description: Publication stage
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - production

concurrency:
  group: repo-assurance-publish-${{ inputs.expected_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: verify-validated-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify validation run and exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ inputs.expected_tag }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          set -euo pipefail

          [[ "$EXPECTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::expected_tag must be an exact SemVer-like vX.Y.Z tag"
            exit 1
          }
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::validation_run_id must be numeric"
            exit 1
          }

          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${EXPECTED_TAG}")"
          tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
          tag_type="$(jq -r '.object.type' <<<"$tag_object")"
          if [[ "$tag_type" == "tag" ]]; then
            tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
            tag_sha="$(jq -r '.object.sha' <<<"$tag_object")"
            tag_type="$(jq -r '.object.type' <<<"$tag_object")"
          fi
          [[ "$tag_type" == "commit" ]] || {
            echo "::error::release tag must resolve to a commit"
            exit 1
          }

          run_object="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}")"
          run_path="$(jq -r '.path' <<<"$run_object")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_object")"
          run_head_sha="$(jq -r '.head_sha' <<<"$run_object")"

          [[ "$run_path" == ".github/workflows/release.yml" ]] || {
            echo "::error::validation_run_id is not a Release Validation workflow run"
            exit 1
          }
          [[ "$run_conclusion" == "success" ]] || {
            echo "::error::Release Validation run did not succeed"
            exit 1
          }
          [[ "$run_head_sha" == "$tag_sha" ]] || {
            echo "::error::Release Validation run SHA does not match the requested tag"
            exit 1
          }

          echo "TAG_SHA=$tag_sha" >> "$GITHUB_ENV"

      - name: Download validated release artifact set
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG: ${{ inputs.expected_tag }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          mkdir -p dist/release
          gh run download "$VALIDATION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "repo-assurance-release-${EXPECTED_TAG}" \
            --dir dist/release

      - name: Verify checksums and manifest provenance
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
          TAG_SHA: ${{ env.TAG_SHA }}
        run: |
          cd dist/release
          sha256sum --check SHA256SUMS
          cd ../..

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          release = Path("dist/release")
          manifest = json.loads(
              (release / "release-manifest.json").read_text(encoding="utf-8")
          )
          expected_tag = os.environ["EXPECTED_TAG"]
          tag_sha = os.environ["TAG_SHA"]

          if manifest.get("tag") != expected_tag:
              raise SystemExit("release manifest tag does not match publication request")
          if manifest.get("git_commit") != tag_sha:
              raise SystemExit("release manifest commit does not match exact release tag")
          if manifest.get("version") != expected_tag.removeprefix("v"):
              raise SystemExit("release manifest version does not match release tag")

          artifacts = manifest.get("artifacts", [])
          if not artifacts:
              raise SystemExit("release manifest contains no artifacts")

          for item in artifacts:
              path = release / item["name"]
              if not path.is_file():
                  raise SystemExit(f"manifest artifact is missing: {path.name}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item["sha256"]:
                  raise SystemExit(f"manifest digest mismatch: {path.name}")
          PY

      - name: Stage validated publication bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-release-for-publication
          path: dist/release
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: publish-testpypi
    if: inputs.target == 'testpypi'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/repo-assurance
    permissions:
      contents: read
      id-token: write # nosemgrep -- GitHub OIDC permission name; no credential value is stored.
    steps:
      - name: Download validated publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-for-publication
          path: dist/release

      - name: Select Python distributions
        run: |
          mkdir -p dist/pypi
          cp dist/release/repo_assurance-*.whl dist/pypi/
          cp dist/release/repo_assurance-*.tar.gz dist/pypi/
          test "$(find dist/pypi -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish Python distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi/
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  verify-testpypi:
    name: verify-testpypi
    if: inputs.target == 'testpypi'
    needs: publish-testpypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"

      - name: Download validated publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-for-publication
          path: dist/release

      - name: Verify TestPyPI files match validated artifacts
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          VERSION="${EXPECTED_TAG#v}"
          python scripts/verify_pypi_release.py \
            --index testpypi \
            --version "$VERSION" \
            --release-dir dist/release

      - name: Smoke-test exact TestPyPI-published CLI artifact
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          VERSION="${EXPECTED_TAG#v}"
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r requirements/ci.lock
          WHEEL="$(find dist/release -maxdepth 1 -type f -name 'repo_assurance-*.whl' -print -quit)"
          test -n "$WHEEL"
          PYTHONPATH="$WHEEL" VERSION="$VERSION" python - <<'PY'
          import importlib.metadata
          import os

          from repo_assurance.cli import build_parser

          actual = importlib.metadata.version("repo-assurance")
          expected = os.environ["VERSION"]
          if actual != expected:
              raise SystemExit(f"wheel version {actual!r} != expected {expected!r}")

          parser = build_parser()
          try:
              parser.parse_args(["--help"])
          except SystemExit as exc:
              if exc.code != 0:
                  raise
          else:
              raise SystemExit("CLI --help did not exit")
          PY

  verify-testpypi-gate:
    name: verify-testpypi-production-gate
    if: inputs.target == 'production'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"

      - name: Download validated publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-for-publication
          path: dist/release

      - name: Require exact validated files on TestPyPI
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          VERSION="${EXPECTED_TAG#v}"
          python scripts/verify_pypi_release.py \
            --index testpypi \
            --version "$VERSION" \
            --release-dir dist/release

      - name: Re-smoke exact staged CLI artifact before production
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          VERSION="${EXPECTED_TAG#v}"
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r requirements/ci.lock
          WHEEL="$(find dist/release -maxdepth 1 -type f -name 'repo_assurance-*.whl' -print -quit)"
          test -n "$WHEEL"
          PYTHONPATH="$WHEEL" VERSION="$VERSION" python - <<'PY'
          import importlib.metadata
          import os

          from repo_assurance.cli import build_parser

          actual = importlib.metadata.version("repo-assurance")
          expected = os.environ["VERSION"]
          if actual != expected:
              raise SystemExit(f"wheel version {actual!r} != expected {expected!r}")

          parser = build_parser()
          try:
              parser.parse_args(["--help"])
          except SystemExit as exc:
              if exc.code != 0:
                  raise
          else:
              raise SystemExit("CLI --help did not exit")
          PY

  publish-pypi:
    name: publish-pypi
    if: inputs.target == 'production'
    needs:
      - prepare
      - verify-testpypi-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/repo-assurance
    permissions:
      contents: read
      id-token: write # nosemgrep -- GitHub OIDC permission name; no credential value is stored.
    steps:
      - name: Download validated publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-for-publication
          path: dist/release

      - name: Select Python distributions
        run: |
          mkdir -p dist/pypi
          cp dist/release/repo_assurance-*.whl dist/pypi/
          cp dist/release/repo_assurance-*.tar.gz dist/pypi/
          test "$(find dist/pypi -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pypi/
          attestations: true

  verify-pypi:
    name: verify-pypi
    if: inputs.target == 'production'
    needs: publish-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release verification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"

      - name: Download validated publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-for-publication
          path: dist/release

      - name: Verify PyPI files match validated artifacts
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          VERSION="${EXPECTED_TAG#v}"
          python scripts/verify_pypi_release.py \
            --index pypi \
            --version "$VERSION" \
            --release-dir dist/release

      - name: Smoke-test exact PyPI-published CLI artifact
        env:
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          VERSION="${EXPECTED_TAG#v}"
          python -m pip install --disable-pip-version-check \
            --only-binary=:all: --require-hashes -r requirements/ci.lock
          WHEEL="$(find dist/release -maxdepth 1 -type f -name 'repo_assurance-*.whl' -print -quit)"
          test -n "$WHEEL"
          PYTHONPATH="$WHEEL" VERSION="$VERSION" python - <<'PY'
          import importlib.metadata
          import os

          from repo_assurance.cli import build_parser

          actual = importlib.metadata.version("repo-assurance")
          expected = os.environ["VERSION"]
          if actual != expected:
              raise SystemExit(f"wheel version {actual!r} != expected {expected!r}")

          parser = build_parser()
          try:
              parser.parse_args(["--help"])
          except SystemExit as exc:
              if exc.code != 0:
                  raise
          else:
              raise SystemExit("CLI --help did not exit")
          PY

  publish-github-release:
    name: publish-github-release
    if: inputs.target == 'production'
    needs:
      - prepare
      - verify-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-release-for-publication
          path: dist/release

      - name: Create GitHub Release from validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          if gh release view "$EXPECTED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release already exists"
            exit 1
          fi
          gh release create "$EXPECTED_TAG" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "Repo Assurance ${EXPECTED_TAG}"
