name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development and plugin dependencies
        run: python -m pip install -e ".[dev,plugin]"

      - name: Run test suite
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate control catalog
        run: |
          for catalog in controls/*.v1.json; do
            python -m repo_assurance validate control "$catalog"
          done

      - name: Build plugin archive
        run: python scripts/build_plugin.py
