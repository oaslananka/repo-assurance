name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r requirements/ci.lock

      - name: Install repository package without resolving dependencies
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify CI lock is current
        run: |
          python scripts/update_ci_lock.py
          git diff --exit-code -- requirements/ci.lock

      - name: Run test suite
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate control catalog
        run: |
          for catalog in controls/*.v1.json; do
            python -m repo_assurance validate control "$catalog"
          done

      - name: Build plugin archive
        run: python scripts/build_plugin.py
